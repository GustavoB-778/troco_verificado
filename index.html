<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIM Informações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Marcenaria do Jao</h1>


    <div>
        <label for="unitaria">Preço unitario do produto:</label>
        <input type="number" id="unitaria" placeholder="Digite aqui o preço unitario do produto">
    </div>


    <div>
        <label for="quantidad">Quantidade comprada:</label>
        <input type="number" id="quantidad" placeholder="Digite aqui a quantidade comprada do produto:">
    </div>


    <div>
        <label for="client">Valor do dinheiro dado pelo cliente:</label>
        <input type="number" id="client" placeholder="Digite aqui o valor do dinheiro dado pelo cliente:">
    </div>

    <button>Calcular</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
